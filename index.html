<style>
:root{--night:#0F2A2E;--gold:#D9B26F;--gold-soft:#E9CF97;--cream:#F3EBDD;--ink:#071719}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--cream);font-family:'Manrope','Segoe UI',Arial,sans-serif}
.lock{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.box{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:14px}
.ring{width:150px;height:150px;border-radius:50%;border:1px solid rgba(217,178,111,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(217,178,111,.06)}
.ring i{font-family:'Cormorant Garamond',Georgia,serif;font-size:20px}
.ring b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:72px;line-height:.9;color:var(--gold)}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:30px;line-height:1.1;margin:8px 0 0}
p{margin:0;color:rgba(243,235,221,.82);font-size:15px;line-height:1.5}
form{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:6px}
label{font-weight:600;font-size:15px;text-align:left}
input{width:100%;min-height:52px;padding:12px 14px;border-radius:10px;border:1px solid rgba(217,178,111,.55);background:rgba(7,23,25,.55);color:var(--cream);font:inherit;font-size:18px;text-align:center}
input[aria-invalid="true"]{border-color:#F6B8A8}
button{min-height:52px;border-radius:12px;border:0;background:var(--gold);color:var(--ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
button:disabled{opacity:.7}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px}
.err{color:#F6B8A8;font-weight:600;min-height:22px}
.hint{font-size:14px}
</style>
